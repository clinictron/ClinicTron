name: BRIGHT
source: 'BRIGHT (Su et al. 2024), `documents` config, gold_ids; excluded_ids removed at scoring. Instructions: FlagEmbedding evaluation/bright/prompts.py BrightShortInstructions, as used by ReasonEmbed''s
  published 38.1 (scripts/ours/eval_reason_embed_qwen3_8b.sh: 8192/8192)'
data: data/bright/{task}
dtype: float16
max_length: 8192
model_overrides:
  Qwen3-Embedding-8B:
    query_template: 'Instruct: {instruction}

      Query: {text}'
    instruction_set: default
  ClinicTron-Qwen:
    query_template: 'Instruct: {instruction}

      Query: {text}'
    instruction_set: default
  NV-Embed-v2:
    instruction_set: default
  ClinicTron-NV:
    instruction_set: default
tasks:
  bright_biology:
    dir: biology
    instruction: Given a Biology post, retrieve relevant passages that help answer the post.
    instructions:
      bright_official: Given a biology post, retrieve relevant passages that help answer the post
  bright_earth_science:
    dir: earth_science
    instruction: Given an Earth Science post, retrieve relevant passages that help answer the post.
    instructions:
      bright_official: Given a earth_science post, retrieve relevant passages that help answer the post
