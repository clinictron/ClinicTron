# Multi-hop evaluation v2 on the Real-POCQi physician questions (comparison against a commercial clinical search product).
benchmark: physician_questions         # physician_questions | pmc_patients; physician_questions also offers the FDA drug-label tool
hops: 3                         # search rounds; one query per round; a ranking is taken after every round
per_hop: 25                     # results per search
keep: 15                        # sources per ranking (the agent may list fewer if fewer are relevant)
budget_usd: 0                   # stop when OpenRouter spend in the run folder passes this; 0 = no cap
agents:                         # name -> backend, model, parallel conversations
  luna: {backend: openrouter, model: openai/gpt-5.6-luna, concurrent_calls: 24}
  terra: {backend: openrouter, model: openai/gpt-5.6-terra, concurrent_calls: 24}
  opus: {backend: claude_cli, model: claude-opus-5-5, concurrent_calls: 6}
prompt: prompts/agent_physician_questions_v2.md
zero_shot_prompt: prompts/agent_zero_shot_physician_questions_v2.md   # the arm without a search tool (--arm zero_shot)
rank_prompt: prompts/rank_v2.md
driver_messages: prompts/driver_messages_v2.yaml
